{% raw %}
<!-- Simplified eigenvalue configuration demo for the front page. -->
<style>
#ec-front { margin: 25px 0 30px; }
#ec-front .ecf-panel {
  background: #fff; padding: 5px 15px 0;
  -webkit-filter: drop-shadow(5px 5px 5px #222);
  filter: drop-shadow(5px 5px 5px #222);
}
#ec-front svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
#ec-front .ecf-pt { cursor: grab; transition: transform .25s ease; }
#ec-front .ecf-pt:active { cursor: grabbing; }
#ec-front .ecf-pt.ecf-dragging { transition: none; }
#ec-front .ecf-pt:focus { outline: none; }
#ec-front .ecf-pt:focus .ecf-ring { stroke: #2a7ae2; }
#ec-front .ecf-lbl { transition: transform .25s ease; }
@media (prefers-reduced-motion: reduce) { #ec-front .ecf-pt, #ec-front .ecf-lbl { transition: none; } }
#ec-front .ecf-math { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; }
#ec-front .ecf-result { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 5px 20px; margin: 22px 0 6px; }
#ec-front .ecf-ec { font-size: 24px; }
#ec-front button {
  font: inherit; font-size: 14px; cursor: pointer; color: #2a7ae2;
  background: transparent; border: 1px solid #e8e8e8; border-radius: 3px; padding: 3px 10px;
}
#ec-front button:hover { border-color: #2a7ae2; }
#ec-front .ecf-note { color: #828282; font-size: 15px; min-height: 1.5em; }
#ec-front .ecf-red { color: #f00; } #ec-front .ecf-blue { color: #00f; }
</style>

<div id="ec-front">
  <p>Drag the points. The <span class="ecf-red">red</span> points are the eigenvalues of a matrix <i>F</i>, the
  <span class="ecf-blue">blue</span> points are the eigenvalues of a matrix <i>G</i>, and the
  <em>eigenvalue configuration</em> counts how many blue points fall in each region marked under the line.</p>

  <div class="ecf-panel">
    <svg id="ecf-svg" viewBox="0 0 800 170" role="img" aria-labelledby="ecf-desc">
      <desc id="ecf-desc"></desc>
      <g id="ecf-ticks"></g>
      <line id="ecf-axis" x1="12" x2="788" y1="110" y2="110" stroke="#111" stroke-width="1.5"/>
      <path id="ecf-arrow" fill="none" stroke="#111" stroke-width="1.5"/>
      <g id="ecf-brk"></g>
      <g id="ecf-pts"></g>
    </svg>
  </div>

  <div class="ecf-result">
    <span class="ecf-math ecf-ec" aria-live="polite">EC(<i>F</i>, <i>G</i>) = <span id="ecf-ec"></span></span>
    <button type="button" id="ecf-reset">Reset</button>
  </div>
  <p class="ecf-note" id="ecf-note"></p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var RED = '#f00', BLUE = '#00f', GREY = '#828282';
  var SERIF = '"Latin Modern Roman","CMU Serif","Times New Roman",Times,serif';
  var LO = 0, HI = 5, STEP = 0.5, Y = 110, LEVEL = 54;
  var START = { red: [1, 3], blue: [2, 4] };
  var RESEARCH = '/research#shared-eigenvalues';
  var svg = $('ecf-svg'), W = 800, sx;
  var pts = [];                        // {v, color, node}

  function el(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function frac(x) {                   // multiples of 1/4
    var q = Math.round(x * 4), w = Math.floor(q / 4), r = q - 4 * w, f = ['', '¼', '½', '¾'][r];
    return f ? (w ? String(w) : '') + f : String(w);
  }

  // contribution of each blue point to c1 and c2 (in quarters), averaging over the four ways of nudging the red points
  function contributions(al, be) {
    return be.map(function (b) {
      var q = [0, 0];
      [-1, 1].forEach(function (d1) { [-1, 1].forEach(function (d2) {
        var d = [d1, d2], k = 0;
        al.forEach(function (a, i) { if (a < b || (a === b && d[i] < 0)) k++; });
        if (k > 0) q[k - 1]++;
      }); });
      return q;
    });
  }
  // label "c_t = 1/2 + 1/2 = 1": one term per blue point that contributes, in blue
  function labelHTML(t, parts) {
    var terms = parts.filter(function (q) { return q > 0; });
    var total = parts.reduce(function (a, b) { return a + b; }, 0);
    var html = 'c<tspan font-size="13" dy="4">' + t + '</tspan><tspan dy="-4"> = </tspan>';
    if (!terms.length) return html + '<tspan>0</tspan>';
    html += terms.map(function (q) { return '<tspan fill="#00f">' + frac(q / 4) + '</tspan>'; }).join('<tspan> + </tspan>');
    if (terms.length > 1) html += '<tspan> = ' + frac(total / 4) + '</tspan>';
    return html;
  }

  // EC(F, G) for 2 red points, averaging over the four ways of nudging the red points left or right
  function configuration(al, be) {
    var c = [0, 0];
    [-1, 1].forEach(function (d1) { [-1, 1].forEach(function (d2) {
      var d = [d1, d2];
      be.forEach(function (b) {
        var k = 0;
        al.forEach(function (a, i) { if (a < b || (a === b && d[i] < 0)) k++; });
        if (k > 0) c[k - 1]++;
      });
    }); });
    return [c[0] / 4, c[1] / 4];
  }

  function resize() {
    W = Math.round(Math.min(800, Math.max(300, svg.parentElement.clientWidth - 30)));
    var pad = W < 500 ? 24 : 45;
    sx = function (v) { return pad + (v - LO) / (HI - LO) * (W - 2 * pad); };
    $('ecf-axis').setAttribute('x2', W - 12);
    $('ecf-arrow').setAttribute('d', 'M' + (W - 24) + ' ' + (Y - 6) + 'L' + (W - 12) + ' ' + Y + 'L' + (W - 24) + ' ' + (Y + 6));
    var ticks = $('ecf-ticks'); ticks.innerHTML = '';
    for (var t = LO; t <= HI; t++) ticks.appendChild(el('line', { x1: sx(t), x2: sx(t), y1: Y - 4, y2: Y + 4, stroke: GREY, 'stroke-width': 1 }));
  }

  function makePoint(v, color) {
    var p = { v: v, color: color };
    var g = el('g', { 'class': 'ecf-pt', tabindex: 0, role: 'slider', 'aria-valuemin': LO, 'aria-valuemax': HI });
    g.appendChild(el('circle', { 'class': 'ecf-ring', r: 16, fill: 'transparent', stroke: 'transparent', 'stroke-width': 2 }));
    g.appendChild(el('circle', { r: 10, fill: color }));
    p.label = el('text', { y: -18, 'text-anchor': 'middle', 'font-size': 24, fill: color, 'font-family': SERIF, 'font-style': 'italic' });
    g.appendChild(p.label);
    $('ecf-pts').appendChild(g);
    p.node = g;
    g.addEventListener('pointerdown', function (e) {
      e.preventDefault(); g.focus(); g.setPointerCapture(e.pointerId); g.classList.add('ecf-dragging');
      var move = function (ev) {
        var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
        var x = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
        var v = LO + (x - sx(LO)) / (sx(HI) - sx(LO)) * (HI - LO);
        v = Math.max(LO, Math.min(HI, Math.round(v / STEP) * STEP));
        if (v !== p.v) { p.v = v; update(); }
      };
      var up = function () {
        g.classList.remove('ecf-dragging');
        g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
      };
      g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
    });
    g.addEventListener('keydown', function (e) {
      var dv = { ArrowLeft: -STEP, ArrowDown: -STEP, ArrowRight: STEP, ArrowUp: STEP }[e.key];
      if (dv === undefined) return;
      e.preventDefault(); p.v = Math.max(LO, Math.min(HI, p.v + dv)); update();
    });
    return p;
  }

  // brackets under the line for the two regions that c1 and c2 count
  var b1 = el('path', { fill: 'none', stroke: GREY, 'stroke-width': 1.2 });
  var b2 = el('path', { fill: 'none', stroke: GREY, 'stroke-width': 1.2 });
  var l1 = el('text', { 'class': 'ecf-lbl', 'text-anchor': 'middle', 'font-size': 18, fill: GREY, y: Y + 50, 'font-family': SERIF });
  var l2 = l1.cloneNode();
  [b1, b2, l1, l2].forEach(function (n) { $('ecf-brk').appendChild(n); });

  function update() {
    var reds = pts.filter(function (p) { return p.color === RED; }).sort(function (a, b) { return a.v - b.v; });
    var blues = pts.filter(function (p) { return p.color === BLUE; }).sort(function (a, b) { return a.v - b.v; });
    var al = reds.map(function (p) { return p.v; }), be = blues.map(function (p) { return p.v; });

    // place points; a point on top of another stacks above it (reds below blues)
    var placed = [];
    reds.concat(blues).forEach(function (p) {
      var level = placed.filter(function (v) { return v === p.v; }).length;
      placed.push(p.v);
      p.node.style.transform = 'translate(' + sx(p.v) + 'px,' + (Y - LEVEL * level) + 'px)';
    });
    reds.forEach(function (p, i) { p.label.innerHTML = 'α<tspan font-size="16" dy="6" font-style="normal">' + (i + 1) + '</tspan>'; p.node.setAttribute('aria-label', 'Red point alpha ' + (i + 1)); p.node.setAttribute('aria-valuenow', p.v); });
    blues.forEach(function (p, i) { p.label.innerHTML = 'β<tspan font-size="16" dy="6" font-style="normal">' + (i + 1) + '</tspan>'; p.node.setAttribute('aria-label', 'Blue point beta ' + (i + 1)); p.node.setAttribute('aria-valuenow', p.v); });
    var maxLevel = Math.max.apply(null, placed.map(function (v) { return placed.filter(function (w) { return w === v; }).length - 1; }));
    var top = Y - LEVEL * maxLevel - 52;

    var c = configuration(al, be);
    var xa1 = sx(al[0]), xa2 = sx(al[1]), yb = Y + 22, xr = W - 18;
    b1.setAttribute('d', 'M' + xa1 + ' ' + (yb - 6) + 'V' + yb + 'H' + xa2 + 'V' + (yb - 6));
    b2.setAttribute('d', 'M' + (xa2 + 3) + ' ' + (yb - 6) + 'V' + yb + 'H' + xr + 'M' + (xr - 7) + ' ' + (yb - 5) + 'L' + xr + ' ' + yb + 'L' + (xr - 7) + ' ' + (yb + 5));
    b1.style.display = xa2 - xa1 > 8 ? '' : 'none';
    var parts = contributions(al, be);
    l1.innerHTML = labelHTML(1, parts.map(function (q) { return q[0]; }));
    l2.innerHTML = labelHTML(2, parts.map(function (q) { return q[1]; }));
    // center each label under its region, keep it inside the panel, and drop c2 a row if the two would collide
    var w1 = l1.getComputedTextLength ? l1.getComputedTextLength() : 100;
    var w2 = l2.getComputedTextLength ? l2.getComputedTextLength() : 100;
    var clamp = function (x, w) { return Math.max(w / 2 + 6, Math.min(W - w / 2 - 6, x)); };
    var x1 = clamp((xa1 + xa2) / 2, w1), x2 = clamp((xa2 + xr) / 2, w2);
    var collide = x1 + w1 / 2 + 12 > x2 - w2 / 2;
    l1.style.transform = 'translate(' + x1 + 'px,0px)';
    l2.style.transform = 'translate(' + x2 + 'px,' + (collide ? 24 : 0) + 'px)';
    svg.setAttribute('viewBox', '0 ' + top + ' ' + W + ' ' + (Y + (collide ? 88 : 65) - top));

    $('ecf-ec').textContent = '(' + frac(c[0]) + ', ' + frac(c[1]) + ')';
    var shared = be.some(function (b) { return al.indexOf(b) !== -1; });
    var redsMeet = al[0] === al[1];
    var note = '';
    if (shared) note = 'A blue point sits exactly on a red one, so it is split between the neighboring regions. That’s why the configuration can be fractional. <a href="' + RESEARCH + '">How this works</a>';
    else if (redsMeet) note = 'The two red points coincide, so the region for c<sub>1</sub> is empty.';
    $('ecf-note').innerHTML = note;
    $('ecf-desc').textContent = 'Red points at ' + al.join(' and ') + ', blue points at ' + be.join(' and ') +
      '. Eigenvalue configuration (' + frac(c[0]) + ', ' + frac(c[1]) + ').';
  }

  function reset() {
    pts.forEach(function (p) { p.node.remove(); });
    pts = START.red.map(function (v) { return makePoint(v, RED); })
      .concat(START.blue.map(function (v) { return makePoint(v, BLUE); }));
    update();
  }
  $('ecf-reset').addEventListener('click', reset);
  resize(); reset();
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { var w = W; resize(); if (W !== w) update(); }, 150);
  });
})();
</script>
{% endraw %}
